name: Archive GitHub traffic

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-history
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and archive aggregate traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "::notice::TRAFFIC_TOKEN secret is not configured. Skipping traffic collection."
            exit 0
          fi
          python scripts/archive_traffic.py
      - name: Commit changed aggregate history
        run: |
          if git diff --quiet -- traffic/history.json; then
            echo "No new traffic data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traffic/history.json
          git commit -m "data: archive daily aggregate GitHub traffic"
          git push
